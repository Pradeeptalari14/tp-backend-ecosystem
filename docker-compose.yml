version: '3.8'

services:
  # Ingress Reverse Proxy
  nginx:
    image: nginx:1.25-alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - ecommerce-api
      - notification-hub
      - billing-api

  # Project 1: E-Commerce Order Engine (Python / FastAPI)
  ecommerce-api:
    build:
      context: ./projects/ecommerce-order-engine
      dockerfile: Dockerfile
    environment:
      - DATABASE_URL=postgresql://postgres:secret@postgres:5432/ecommerce_db
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=amqp://guest:guest@rabbitmq:5672//
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - redis
      - rabbitmq

  ecommerce-worker:
    build:
      context: ./projects/ecommerce-order-engine
      dockerfile: Dockerfile
    command: ["python", "worker.py"]
    environment:
      - DATABASE_URL=postgresql://postgres:secret@postgres:5432/ecommerce_db
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - redis
      - rabbitmq

  # Project 2: Real-Time Notification & Event Hub (Node.js)
  notification-hub:
    build:
      context: ./projects/notification-event-hub
      dockerfile: Dockerfile
    environment:
      - PORT=3000
      - REDIS_URL=redis://redis:6379/1
      - DATABASE_URL=postgresql://postgres:secret@postgres:5432/notifications_db
    ports:
      - "3000:3000"
    depends_on:
      - redis
      - postgres

  # Project 3: SaaS Billing & Webhook Dispatcher (Go)
  billing-api:
    build:
      context: ./projects/saas-billing-dispatcher
      dockerfile: Dockerfile
    environment:
      - PORT=8080
      - REDIS_ADDR=redis:6379
      - MYSQL_DSN=root:secret@tcp(mysql:3306)/billing_db
    ports:
      - "8080:8080"
    depends_on:
      - redis
      - mysql

  # Core Infrastructure Components
  redis:
    image: redis:7.2-alpine
    command: ["redis-server", "--maxmemory", "512mb", "--maxmemory-policy", "allkeys-lru", "--appendonly", "yes"]
    ports:
      - "6379:6379"

  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_PASSWORD=secret
      - POSTGRES_MULTIPLE_DATABASES=ecommerce_db,notifications_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  mysql:
    image: mysql:8.4
    environment:
      - MYSQL_ROOT_PASSWORD=secret
      - MYSQL_DATABASE=billing_db
    ports:
      - "3306:3306"
    volumes:
      - mysqldata:/var/lib/mysql

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672"

  prometheus:
    image: prom/prometheus:v2.51.0
    ports:
      - "9090:9090"

volumes:
  pgdata:
  mysqldata:
