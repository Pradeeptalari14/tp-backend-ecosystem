events { worker_connections 1024; }

http {
    upstream ecommerce {
        server ecommerce-api:8000;
    }

    upstream notifications {
        server notification-hub:3000;
    }

    upstream billing {
        server billing-api:8080;
    }

    server {
        listen 80;

        location /api/v1/orders {
            proxy_pass http://ecommerce;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /api/v1/notify {
            proxy_pass http://notifications;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /api/v1/billing {
            proxy_pass http://billing;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /health {
            return 200 '{"status":"healthy","ingress":"nginx"}';
            add_header Content-Type application/json;
        }
    }
}
